function hexToRgba(hex, a) {
  const h = hex.replace("#", "");
  const r = parseInt(h.substring(0,2), 16);
  const g = parseInt(h.substring(2,4), 16);
  const b = parseInt(h.substring(4,6), 16);
  return `rgba(${r},${g},${b},${a})`;

// Linearly interpolate a sparse forecast (2 endpoints) into monthly points
// so hover detection works anywhere along the line.
function interpolateForecast(points) {
  if (points.length < 2) return points;
  const start = new Date(points[0].date);
  const end = new Date(points[points.length - 1].date);
  const startMs = start.getTime();
  const endMs = end.getTime();
  const yStart = points[0].price;
  const yEnd = points[points.length - 1].price;
  const out = [];
  const cursor = new Date(start);
  while (cursor <= end) {
    const t = (cursor.getTime() - startMs) / (endMs - startMs);
    const y = yStart + (yEnd - yStart) * t;
    const iso = cursor.toISOString().slice(0, 10);
    out.push({ date: iso, price: y });
    cursor.setMonth(cursor.getMonth() + 1);
  }
  // ensure last endpoint is included
  if (out[out.length - 1].date !== points[points.length - 1].date) {
    out.push(points[points.length - 1]);
  }
  return out;
}

    // 1) Visible realised solid line — no hover here, a markers-only trace handles hover
    traces.push({
      x: m.solid.map(p => p.date),
      y: m.solid.map(p => p.price),
      mode: "lines",
      name: m.label,
      line: { color: m.color, width: 2.5 },
      hoverinfo: "skip",
      showlegend: false,
    });

    // 2) Visible forecast dashed line — full range, no hover
    if (fAll.length > 1) {
      traces.push({
        x: fAll.map(p => p.date),
        y: fAll.map(p => p.price),
        mode: "lines",
        name: m.label + " forecast",
        line: { color: hexToRgba(m.color, 0.5), width: 2, dash: "dash" },
        hoverinfo: "skip",
        showlegend: false,
      });
    }

    // 3) HOVER trace for realised — invisible markers (hidden by CSS) used as hover hitbox
    traces.push({
      x: m.solid.map(p => p.date),
      y: m.solid.map(p => p.price),
      mode: "markers",
      name: "",
      marker: { color: m.color, size: 12, symbol: "circle", opacity: 1 },
      hoverinfo: "x+y",
      meta: { kind: "realized", color: m.color, label: m.label },
      showlegend: false,
    });

    // 4) HOVER trace for forecast (post-today only)
    if (fPost.length > 1) {
      traces.push({
        x: fPost.map(p => p.date),
        y: fPost.map(p => p.price),
        mode: "markers",
        name: "",
        marker: { color: m.color, size: 12, symbol: "circle", opacity: 1 },
        hoverinfo: "x+y",
        meta: { kind: "forecast", color: m.color, label: m.label },
        showlegend: false,
      });
    }
  });
  return traces;
}

const layout = {

const config = {
  displayModeBar: false,
  responsive: true,
  staticPlot: false,
  scrollZoom: false,
  doubleClick: false,
  showAxisDragHandles: false,
};

Plotly.newPlot("chart", buildTraces(), layout, config);
window.addEventListener("resize", () => Plotly.Plots.resize(document.getElementById("chart")));

// Custom HTML hover label — gives us full control over padding, rounded corners,
// dot indicators, font weights, and outline.
const chartEl = document.getElementById("chart");
const customHover = document.getElementById("customHover");
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function fmtDate(s) {
  const d = new Date(s);
  return MONTHS[d.getMonth()] + " " + d.getFullYear();
}
function fmtEur(n) {
  return "€ " + Math.round(n).toLocaleString("en-US");
}
function closestPt(arr, targetMs) {
  let best = null, bestDelta = Infinity;
  for (const p of arr) {
    const delta = Math.abs(new Date(p.date).getTime() - targetMs);
    if (delta < bestDelta) { best = p; bestDelta = delta; }
  }
  return best;
}

function showHover(eventData) {
  if (!eventData || !eventData.points || !eventData.points.length) return;
  const xRaw = eventData.points[0].x;
  const xMs = new Date(xRaw).getTime();
  const todayMs = new Date(TODAY).getTime();
  const isFuture = xMs > todayMs;

  const headerTag = isFuture ? "forecast value" : "realised value";
  let html = '<div class="ch-header">' + fmtDate(xRaw) + ' (' + headerTag + ')</div>';
  DATA.forEach((m) => {
    let pt;
    if (isFuture) {
      const f = interpolateForecast(m.forecast).filter((p) => new Date(p.date).getTime() >= todayMs);
      pt = closestPt(f, xMs);
    } else {
      pt = closestPt(m.solid, xMs);
    }
    if (!pt) return;
    html += '<div class="ch-row">';
    html += '<span class="ch-dot" style="background:' + m.color + '"></span>';
    html += m.label + " " + fmtEur(pt.price);
    html += '</div>';
  });

  customHover.innerHTML = html;
  customHover.style.display = "block";

  // Position the tooltip near the cursor, clamped inside the viewport.
  const evt = eventData.event;
  const pad = 16;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const w = customHover.offsetWidth;
  const h = customHover.offsetHeight;
  let left = evt.pageX + pad;
  let top = evt.pageY + pad;
  if (left + w + 8 > window.scrollX + vw) left = evt.pageX - w - pad;
  if (top + h + 8 > window.scrollY + vh) top = evt.pageY - h - pad;
  customHover.style.left = left + "px";
  customHover.style.top = top + "px";
}

function hideHover() {
  customHover.style.display = "none";
}

chartEl.on("plotly_hover", showHover);
chartEl.on("plotly_unhover", hideHover);
chartEl.addEventListener("mouseleave", hideHover);
</script>
