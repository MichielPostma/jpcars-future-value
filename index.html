<style>
  :root {
    --bg: #000000;
    --fg: #e6e6e6;
    --muted: #9aa0a6;
    --grid: rgba(255,255,255,0.10);
    --axis: rgba(255,255,255,0.55);
    --today: rgba(180,180,180,0.55);
    --c1: #009ad8;
    --c2: #ffc200;
    --c3: #3DD958;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background-color: var(--bg);
    color: var(--fg);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .page {
    max-width: 1400px;
    margin: 0 auto;
    padding: 32px clamp(16px, 4vw, 48px) 48px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .chart-wrap {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: stretch;
    min-height: 0;
  }
  .chart-wrap > .chart { width: 100%; }
  header.top {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 28px;
  }
  .titles { flex: 1; min-width: 0; }
  h1 {
    font-size: clamp(25px, 3vw, 35px);
    font-weight: 600;
    margin: 0 0 6px 0;
    letter-spacing: -0.01em;
    color: #ffffff;
  }
  .subtitle {
    font-size: clamp(13px, 1.4vw, 16px);
    color: var(--muted);
    margin: 0;
    font-weight: 400;
  }
  .logo-wrap {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
  }
  .jp-logo {
    width: clamp(90px, 10vw, 140px);
    height: auto;
    display: block;
  }
  .graph-picker {
    flex: 0 0 auto;
    position: relative;
  }
  .graph-picker select {
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    color: #ffffff;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 14px 56px 14px 22px;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-weight: 400;
    font-size: 20px;
    line-height: 1.2;
    letter-spacing: -0.005em;
    cursor: pointer;
    min-width: 280px;
    transition: border-color 0.15s ease;
  }
  .graph-picker select:hover {
    border-color: #ffffff;
  }
  .graph-picker select:focus,
  .graph-picker select:focus-visible,
  .graph-picker select:active {
    outline: none;
    border-color: rgba(255,255,255,0.18);
    box-shadow: none;
  }
  .graph-picker::after {
    content: "";
    position: absolute;
    right: 22px;
    top: 50%;
    width: 17px;
    height: 11px;
    margin-top: -6px;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8' fill='none' stroke='%23ffffff' stroke-width='1.14' stroke-linecap='round' stroke-linejoin='round'><polyline points='1,1 6,6 11,1'/></svg>");
    background-repeat: no-repeat;
    background-position: center;
    background-size: 17px 11px;
  }
  .graph-picker select option {
    background: #1a1a1a;
    color: #ffffff;
  }
  .chart {
    position: relative;
    width: 100%;
    height: clamp(420px, 60vh, 640px);
    background: transparent;
  }
  .chart::before {
    content: "";
    position: absolute;
    top: 48px;
    right: 24px;
    bottom: 56px;
    left: 64px;
    background-color: transparent;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g stroke='white' stroke-opacity='0.10' stroke-width='1' fill='none'><line x1='0' y1='0' x2='100' y2='0'/><line x1='0' y1='0' x2='0' y2='100'/><line x1='20' y1='0' x2='20' y2='100'/><line x1='40' y1='0' x2='40' y2='100'/><line x1='60' y1='0' x2='60' y2='100'/><line x1='80' y1='0' x2='80' y2='100'/><line x1='0' y1='20' x2='100' y2='20'/><line x1='0' y1='40' x2='100' y2='40'/><line x1='0' y1='60' x2='100' y2='60'/><line x1='0' y1='80' x2='100' y2='80'/></g><circle cx='50' cy='50' r='0.5' fill='white' fill-opacity='0.40'/></svg>");
    background-repeat: repeat;
    background-size: 100px 100px;
    pointer-events: none;
    z-index: 0;
  }
  .chart > .js-plotly-plot {
    position: relative;
    z-index: 1;
  }
  .legend {
    flex: 0 0 auto;
    margin-top: 24px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px 24px;
    padding-left: 4px;
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 400;
    font-size: clamp(13px, 1.2vw, 15px);
    color: #ffffff;
  }
  .legend .left-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px 28px;
  }
  .legend .models {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px 28px;
  }
  .legend .style-hint {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 16px;
    color: #ffffff;
  }
  .legend .logo-wrap .jp-logo {
    width: clamp(136px, 13.6vw, 187px);
  }
  .legend .item {
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .legend .dot {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex: 0 0 12px;
  }
  .legend .line-sample {
    display: inline-block;
    width: 26px;
    height: 0;
    border-top: 2px solid rgba(255,255,255,0.55);
  }
  .legend .line-sample.dashed {
    border-top-style: dashed;
  }
  @media (max-width: 540px) {
    /* Stack header: title block on top, dropdown full-width below.
       Fix for "no lines visible" bug: prior flex-row + select min-width:280px
       squeezed the title to ~39px wide, making the header 377px tall and
       pushing the chart below the viewport on phones. */
    header.top {
      flex-direction: column;
      align-items: stretch;
      gap: 16px;
      margin-bottom: 20px;
    }
    .titles { width: 100%; }
    .graph-picker { width: 100%; }
    .graph-picker select {
      width: 100%;
      min-width: 0;
      font-size: 17px;
      padding: 12px 48px 12px 16px;
    }
    .graph-picker::after { right: 18px; }

    /* Chart can shrink a bit on tall narrow viewports, keeping subplots readable */
    .chart { height: clamp(360px, 55vh, 520px); }

    /* Legend: stack so logo gets its own row with breathing room above */
    .legend {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px 20px;
      margin-top: 20px;
    }
    .legend .logo-wrap {
      width: 100%;
      justify-content: flex-end;
      padding-top: 20px;
    }
    /* Smaller logo on mobile */
    .legend .logo-wrap .jp-logo {
      width: clamp(96px, 25vw, 130px);
    }
    .jp-logo { width: 80px; }
  }
  /* Custom hover label */
  .ch-hover {
    position: absolute;
    background: #474747;
    color: #ffffff;
    padding: 14px 18px;
    border-radius: 6px;
    border: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 13px;
    font-weight: 400;
    line-height: 1.4;
    pointer-events: none;
    z-index: 1000;
    white-space: nowrap;
    display: none;
  }
  .ch-hover .ch-header {
    font-weight: 700;
    font-size: 15px;
    margin: 0 0 8px 0;
    letter-spacing: -0.005em;
  }
  .ch-hover .ch-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 2px 0;
  }
  .ch-hover .ch-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex: 0 0 7px;
  }
  .chart .hoverlayer { display: none !important; }
  .chart .scatterlayer .points path { display: none !important; }
  /* Subtle fade when switching between views via dropdown or arrow keys */
  .view-fade {
    transition: opacity 140ms ease;
    will-change: opacity;
  }
  .view-fade.is-fading {
    opacity: 0;
  }
</style>
</head>

function hexToRgba(hex, a) {
  const h = hex.replace("#", "");
  const r = parseInt(h.substring(0,2), 16);
  const g = parseInt(h.substring(2,4), 16);
  const b = parseInt(h.substring(4,6), 16);
  return `rgba(${r},${g},${b},${a})`;
}

function interpolateForecast(points) {
  if (points.length < 2) return points;
  const start = new Date(points[0].date);
  const end = new Date(points[points.length - 1].date);
  const startMs = start.getTime();
  const endMs = end.getTime();
  const yStart = points[0].price;
  const yEnd = points[points.length - 1].price;
  const out = [];
  const cursor = new Date(start);
  while (cursor <= end) {
    const t = (cursor.getTime() - startMs) / (endMs - startMs);
    const y = yStart + (yEnd - yStart) * t;
    const iso = cursor.toISOString().slice(0, 10);
    out.push({ date: iso, price: y });
    cursor.setMonth(cursor.getMonth() + 1);
  }
  if (out[out.length - 1].date !== points[points.length - 1].date) {
    out.push(points[points.length - 1]);
  }
  return out;
}

function getActiveData(viewKey) {
  const view = VIEWS[viewKey] || VIEWS.comparison;
  return DATA.filter((m) => view.models.includes(m.label));
}

function getForecast(view, m) {
  if (view.forecastOverrides && view.forecastOverrides[m.label]) {
    return view.forecastOverrides[m.label];
  }
  return m.forecast;
}

function getForecastColor(view, m) {
  if (view.forecastColors && view.forecastColors[m.label]) {
    return view.forecastColors[m.label];
  }
  return hexToRgba(m.color, 0.5);
}

function buildTraces() {
  const traces = [];
  const todayDate = new Date(TODAY);

  activeData.forEach((m) => {
    const baseForecast = getForecast(activeView, m);
    const f = interpolateForecast(baseForecast);
    const fAll = f;
    const fPost = f.filter(p => new Date(p.date) >= todayDate);

    // Draw the forecast line FIRST so the realised line is rendered on top
    // (Plotly layers traces in array order — later traces appear in front).
    if (fAll.length > 1) {
      traces.push({
        x: fAll.map(p => p.date),
        y: fAll.map(p => p.price),
        mode: "lines",
        name: m.label + " forecast",
        line: { color: getForecastColor(activeView, m), width: 2, dash: "dash" },
        hoverinfo: "skip",
        showlegend: false,
      });
    }

    traces.push({
      x: m.solid.map(p => p.date),
      y: m.solid.map(p => p.price),
      mode: "lines",
      name: m.label,
      line: { color: m.color, width: 2.5 },
      hoverinfo: "skip",
      showlegend: false,
    });

    traces.push({
      x: m.solid.map(p => p.date),
      y: m.solid.map(p => p.price),
      mode: "markers",
      name: "",
      marker: { color: m.color, size: 12, symbol: "circle", opacity: 1 },
      hoverinfo: "x+y",
      meta: { kind: "realized", color: m.color, label: m.label },
      showlegend: false,
    });

    if (fPost.length > 1) {
      traces.push({
        x: fPost.map(p => p.date),
        y: fPost.map(p => p.price),
        mode: "markers",
        name: "",
        marker: { color: m.color, size: 12, symbol: "circle", opacity: 1 },
        hoverinfo: "x+y",
        meta: { kind: "forecast", color: m.color, label: m.label },
        showlegend: false,
      });
    }

    // Sub-chart traces (only present for models that carry ETR / stock data)
    if (m.etr && m.etr.length) {
      // visible line
      traces.push({
        x: m.etr.map(p => p.date),
        y: m.etr.map(p => p.value),
        mode: "lines",
        line: { color: m.color, width: 1.8 },
        xaxis: "x",
        yaxis: "y2",
        hoverinfo: "skip",
        showlegend: false,
      });
      // invisible hover markers
      traces.push({
        x: m.etr.map(p => p.date),
        y: m.etr.map(p => p.value),
        mode: "markers",
        marker: { color: m.color, size: 12, symbol: "circle", opacity: 1 },
        xaxis: "x",
        yaxis: "y2",
        hoverinfo: "x+y",
        meta: { kind: "etr", color: m.color, label: m.label },
        showlegend: false,
      });
    }
    if (m.stock && m.stock.length) {
      traces.push({
        x: m.stock.map(p => p.date),
        y: m.stock.map(p => p.value),
        mode: "lines",
        line: { color: m.color, width: 1.8 },
        xaxis: "x",
        yaxis: "y3",
        hoverinfo: "skip",
        showlegend: false,
      });
      traces.push({
        x: m.stock.map(p => p.date),
        y: m.stock.map(p => p.value),
        mode: "markers",
        marker: { color: m.color, size: 12, symbol: "circle", opacity: 1 },
        xaxis: "x",
        yaxis: "y3",
        hoverinfo: "x+y",
        meta: { kind: "stock", color: m.color, label: m.label },
        showlegend: false,
      });
    }
  });
  return traces;
}

    text: "Today", showarrow: false,
    font: { family: FONT_FAMILY, color: AXIS, size: 14 },
    xanchor: "left",
  }],
};

const config = {
  displayModeBar: false,
  responsive: true,
  staticPlot: false,
  scrollZoom: false,
  doubleClick: false,
  showAxisDragHandles: false,
};

function renderLegendModels() {
  const wrap = document.getElementById("legendModels");
  if (!wrap) return;
  wrap.innerHTML = activeData.map((m) =>
    '<span class="item"><span class="dot" style="background:' + m.color + '"></span>' + m.label + '</span>'
  ).join("");
}

// Base annotation set (Today). The y-axis titles in subplot mode are added
// dynamically below so they all sit at the same paper-x for visual alignment.
const BASE_ANNOTATIONS = [{
  x: TODAY, xref: "x", yref: "paper",
  y: 1, xshift: 10, yshift: 18,
  text: "Today", showarrow: false,
  font: { family: FONT_FAMILY, color: AXIS, size: 14 },
  xanchor: "left",
}];

function configureLayoutForView(view) {
  // Main y-axis range
  if (view.yRange) {
    layout.yaxis.range = view.yRange;
    layout.yaxis.autorange = false;
  } else {
    delete layout.yaxis.range;
    layout.yaxis.autorange = true;
  }
  if (view.layout === "subplots") {
    // Three stacked panels sharing one x-axis: main price (top), ETR, Stock count.
    layout.yaxis.domain = [0.55, 1.0];
    // Hide built-in y-axis title — we draw it as an annotation for alignment.
    layout.yaxis.title = { text: "" };
    const subAxisBase = {
      anchor: "x",
      showgrid: false,
      showline: true,
      linecolor: "rgba(180,180,180,0.55)",
      linewidth: 1,
      mirror: false,
      ticks: "outside",
      ticklen: 8,
      tickwidth: 0,
      tickcolor: "rgba(0,0,0,0)",
      tickfont: { color: AXIS, family: FONT_FAMILY },
      zeroline: false,
      autorange: false,
    };
    layout.yaxis2 = Object.assign({}, subAxisBase, {
      domain: [0.30, 0.48],
      range: view.etrRange || [0, 6],
    });
    layout.yaxis3 = Object.assign({}, subAxisBase, {
      domain: [0.0, 0.22],
      range: view.stockRange || [0, 250],
    });
    layout.xaxis.anchor = "y3";

    // Custom axis-title annotations aligned on the same paper-x.
    const TITLE_X = -0.045;
    const titleFont = { family: FONT_FAMILY, color: AXIS, size: 14 };
    const mkTitle = (y, text) => ({
      xref: "paper", yref: "paper",
      x: TITLE_X, y: y,
      text: text, showarrow: false,
      textangle: -90,
      xanchor: "center", yanchor: "middle",
      font: titleFont,
    });
    layout.annotations = BASE_ANNOTATIONS.concat([
      mkTitle(0.775, "Price (EUR)"),
      mkTitle(0.39, "ETR"),
      mkTitle(0.11, "Stock count"),
    ]);
  } else {
    layout.yaxis.domain = [0.0, 1.0];
    layout.yaxis.title = { text: "Price (EUR)", font: { color: AXIS, family: FONT_FAMILY, size: 14 }, standoff: 14 };
    delete layout.yaxis2;
    delete layout.yaxis3;
    layout.xaxis.anchor = "y";
    layout.annotations = BASE_ANNOTATIONS.slice();
  }
}

function renderTitles(view) {
  const titleEl = document.getElementById("pageTitle");
  const subtitleEl = document.getElementById("pageSubtitle");
  if (titleEl && view.title) titleEl.textContent = view.title;
  if (subtitleEl && view.subtitle) subtitleEl.textContent = view.subtitle;
}

const fadeEls = () => Array.from(document.querySelectorAll(".view-fade"));
let fadeTimer = null;

function applyView(viewKey) {
  const els = fadeEls();
  els.forEach((el) => el.classList.add("is-fading"));
  if (fadeTimer) clearTimeout(fadeTimer);
  fadeTimer = setTimeout(() => {
    activeView = VIEWS[viewKey] || VIEWS.comparison;
    activeData = getActiveData(viewKey);
    renderTitles(activeView);
    renderLegendModels();
    configureLayoutForView(activeView);
    Plotly.react("chart", buildTraces(), layout, config);
    requestAnimationFrame(() => {
      els.forEach((el) => el.classList.remove("is-fading"));
    });
  }, 140);
}

// Initial render: read the currently selected option (default = comparison).
const graphPicker = document.getElementById("graphPicker");
activeView = VIEWS[graphPicker.value] || VIEWS.comparison;
activeData = getActiveData(graphPicker.value);
renderTitles(activeView);
renderLegendModels();
configureLayoutForView(activeView);

Plotly.newPlot("chart", buildTraces(), layout, config);
window.addEventListener("resize", () => Plotly.Plots.resize(document.getElementById("chart")));

graphPicker.addEventListener("change", (e) => applyView(e.target.value));

// Arrow key navigation cycles through dropdown options.
document.addEventListener("keydown", (e) => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  const opts = Array.from(graphPicker.options);
  const cur = opts.findIndex((o) => o.value === graphPicker.value);
  if (cur < 0) return;
  const step = e.key === "ArrowRight" ? 1 : -1;
  const next = (cur + step + opts.length) % opts.length;
  if (next === cur) return;
  graphPicker.value = opts[next].value;
  applyView(graphPicker.value);
  e.preventDefault();
});

const chartEl = document.getElementById("chart");
const customHover = document.getElementById("customHover");
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function fmtDate(s) {
  const d = new Date(s);
  return MONTHS[d.getMonth()] + " " + d.getFullYear();
}
function fmtEur(n) {
  return "€ " + Math.round(n).toLocaleString("en-US");
}
function closestPt(arr, targetMs) {
  let best = null, bestDelta = Infinity;
  for (const p of arr) {
    const delta = Math.abs(new Date(p.date).getTime() - targetMs);
    if (delta < bestDelta) { best = p; bestDelta = delta; }
  }
  return best;
}

function showHover(eventData) {
  if (!eventData || !eventData.points || !eventData.points.length) return;
  const point = eventData.points[0];
  const xRaw = point.x;
  const xMs = new Date(xRaw).getTime();
  const todayMs = new Date(TODAY).getTime();
  const isFuture = xMs > todayMs;
  const kind = (point.data && point.data.meta && point.data.meta.kind) || "price";

  let html;
  if (kind === "etr") {
    html = '<div class="ch-header">' + fmtDate(xRaw) + '</div>';
    activeData.forEach((m) => {
      if (!m.etr) return;
      const pt = closestPt(m.etr, xMs);
      if (!pt) return;
      html += '<div class="ch-row">';
      html += '<span class="ch-dot" style="background:' + m.color + '"></span>';
      html += m.label + " " + pt.value.toFixed(2);
      html += '</div>';
    });
  } else if (kind === "stock") {
    html = '<div class="ch-header">' + fmtDate(xRaw) + '</div>';
    activeData.forEach((m) => {
      if (!m.stock) return;
      const pt = closestPt(m.stock, xMs);
      if (!pt) return;
      html += '<div class="ch-row">';
      html += '<span class="ch-dot" style="background:' + m.color + '"></span>';
      html += m.label + " " + Math.round(pt.value);
      html += '</div>';
    });
  } else {
    const headerTag = isFuture ? "forecast value" : "realised value";
    html = '<div class="ch-header">' + fmtDate(xRaw) + ' (' + headerTag + ')</div>';
    activeData.forEach((m) => {
      let pt;
      if (isFuture) {
        const f = interpolateForecast(getForecast(activeView, m)).filter((p) => new Date(p.date).getTime() >= todayMs);
        pt = closestPt(f, xMs);
      } else {
        pt = closestPt(m.solid, xMs);
      }
      if (!pt) return;
      html += '<div class="ch-row">';
      html += '<span class="ch-dot" style="background:' + m.color + '"></span>';
      html += m.label + " " + fmtEur(pt.price);
      html += '</div>';
    });
  }

  customHover.innerHTML = html;
  customHover.style.display = "block";

  const evt = eventData.event;
  const pad = 16;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const w = customHover.offsetWidth;
  const h = customHover.offsetHeight;
  let left = evt.pageX + pad;
  let top = evt.pageY + pad;
  if (left + w + 8 > window.scrollX + vw) left = evt.pageX - w - pad;
  if (top + h + 8 > window.scrollY + vh) top = evt.pageY - h - pad;
  customHover.style.left = left + "px";
  customHover.style.top = top + "px";
}

function hideHover() {
  customHover.style.display = "none";
}

chartEl.on("plotly_hover", showHover);
chartEl.on("plotly_unhover", hideHover);
chartEl.addEventListener("mouseleave", hideHover);
</script>
</body>
</html>
